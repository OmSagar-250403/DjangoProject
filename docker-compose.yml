services:
  postgres:
    image: postgres:17-alpine
    container_name: fuelroute-postgres
    environment:
      POSTGRES_DB: fuelroute
      POSTGRES_USER: fuelroute
      POSTGRES_PASSWORD: FuelR0ute!2026
    ports:
      - "5433:5432"
    volumes:
      - fuelroute-postgres-data:/var/lib/postgresql/data
    networks:
      - fuelroute-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelroute -d fuelroute"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  fuelroute-net:
    name: fuelroute-net

volumes:
  fuelroute-postgres-data:
